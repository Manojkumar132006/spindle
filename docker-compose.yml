services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spindle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spindle}
      POSTGRES_USER: ${POSTGRES_USER:-spindle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spindle_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spindle} -d ${POSTGRES_DB:-spindle}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
